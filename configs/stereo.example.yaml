extends: default.yaml

# Copy to stereo.yaml and fill in the local serials and factory file paths.
stereo:
  serial_cam0: "SET_D435I_SERIAL"
  serial_cam1: "SET_D415_SERIAL"
  width: 640
  height: 480
  fps: 30
  intrinsics_cam0: calib/realsense_probe/intrinsics_color_CAM0_SERIAL_640x480_30.json
  intrinsics_cam1: calib/realsense_probe/intrinsics_color_CAM1_SERIAL_640x480_30.json
  extrinsics: calib/stereo_extrinsics.json
  max_pair_gap_ms: 20.0
  pair_lookahead_frames: 0
  max_reproj_px: 3.0
  min_ray_angle_deg: 1.0
  ee_offset_palm: [0.0, 0.0, 0.0]
  bone_rel_tolerance: 0.35

# Reference specification only. Verify the installed print before calibration.
board:
  dictionary: DICT_6X6_250
  squares_x: 5
  squares_y: 7
  square_length: 0.040
  marker_length: 0.024
  legacy_pattern: false
  physical_verified: false
  reference:
    board_width_m: 0.200
    board_height_m: 0.280
    paper_width_m: 0.210
    paper_height_m: 0.297
  verification:
    dictionary_verified: false
    layout_verified: false
    legacy_pattern_verified: false
    print_scale_verified: false
    flatness_verified: false
    measured_board_width_m: null
    measured_board_height_m: null
    measured_square_length_m: null
    measured_marker_length_m: null
